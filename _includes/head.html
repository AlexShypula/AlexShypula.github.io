<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  <link rel="icon" href="{{ "/assets/images/lambda.png" | relative_url }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
  <style>
    .site-header{border-top:0}
    .site-header .wrapper{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
    .site-header .site-title{float:none;line-height:1.3}
    .site-tagline{color:#828282;font-size:16px}
    h2{margin-top:36px}
    img[align=left]{border-radius:8px}

</head>
