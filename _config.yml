# keep the (deliberately unlinked) ai-equity page out of the sitemap
defaults:
  - scope:
      path: "ai-equity"
    values:
      sitemap: false

# ai-equity/ is a static app (index.html + data/) copied through as-is. Keep its model
# source out of the built site; docs/ is left in so the audit renders as pages.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - ai-equity/src
  - ai-equity/config
  - ai-equity/tables
  - ai-equity/SPEC.md
  - ai-equity/README.md
  - ai-equity/reference_v1.html
